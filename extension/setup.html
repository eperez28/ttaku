<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ttaku</title>
  <link rel="stylesheet" href="setup.css">
</head>
<body>
<main>
  <header>
    <button id="back" class="icon" aria-label="Back" hidden><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
    <h1 id="heading">Ttaku</h1>
    <div class="tools" id="tools">
      <button id="open-words" class="icon" aria-label="Word bank" title="Word bank"><svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg></button>
      <button id="open-settings" class="icon" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="17" r="2.5"/></svg></button>
    </div>
  </header>

  <section id="practice-view">
    <p id="session-status" class="status" hidden><span class="dot"></span>Practicing</p>
    <h2 id="episode-title">Open a Crunchyroll episode</h2>
    <p id="error" role="alert" hidden></p>
    <button id="start" class="primary" disabled>Start practice</button>
    <p id="start-hint" class="hint"></p>
    <p id="home-progress" class="progress"></p>
  </section>

  <section id="words-view" hidden>
    <h3>Words you say a lot</h3>
    <div id="spoken"></div>
    <h3>Saved words</h3>
    <div id="words"></div>
    <button id="export" class="secondary" hidden>Export word bank</button>
  </section>

  <section id="settings-view" hidden>
    <h3>Meta Model API key</h3>
    <p class="hint first">Your key lets Ttaku hear the line and check your speaking. It stays in this extension and is only ever sent to Meta.</p>
    <input id="meta-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key" aria-label="Meta Model API key">
    <div class="keyrow">
      <button id="key-save" class="secondary">Save</button>
      <button id="key-test" class="secondary">Test connection</button>
      <button id="key-clear" class="secondary">Clear</button>
    </div>
    <p id="key-status" class="hint" role="status"></p>
    <div class="row"><span>Microphone</span><button class="secondary" id="mic">Allow access</button></div>
    <div class="row"><span>Show Japanese text</span><button id="japanese-toggle" role="switch" aria-checked="false" aria-label="Show Japanese text" class="switch"><span></span></button></div>
    <div class="row"><span>Lines practiced</span><span id="progress" class="value"></span></div>
  </section>
</main>
<script type="module" src="setup.js"></script>
</body>
</html>
