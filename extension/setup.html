<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Taku</title>
  <link rel="stylesheet" href="setup.css">
</head>
<body>
<main>
  <header>
    <button id="back" class="icon" aria-label="Back to practice" hidden><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
    <h1 id="heading">Taku</h1>
    <div class="tools" id="tools">
      <button id="open-words" class="icon" aria-label="Saved words" title="Saved words"><svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg></button>
      <button id="open-settings" class="icon" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="17" r="2.5"/></svg></button>
    </div>
  </header>
  <section id="practice-view">
    <h2 id="episode-title">Open a Crunchyroll episode</h2>
    <p id="helper" role="status" hidden></p>
    <p id="error" role="alert" hidden></p>
    <button id="start" class="primary" disabled>Checking connection…</button>
  </section>
  <section id="words-view" hidden>
    <div id="words"></div>
    <button id="export" class="secondary" hidden>Export saved words</button>
  </section>
  <section id="settings-view" hidden>
    <div class="row"><span>Microphone</span><button class="secondary" id="mic">Allow access</button></div>
    <div class="row"><span>Show Japanese text</span><button id="japanese-toggle" role="switch" aria-checked="false" aria-label="Show Japanese text" class="switch"><span></span></button></div>
    <div class="row"><span id="progress"></span><span id="usage"></span></div>
  </section>
</main>
<script type="module" src="setup.js"></script>
</body>
</html>
