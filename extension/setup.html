<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ttaku</title>
  <link rel="stylesheet" href="setup.css">
</head>
<body>
<main>
  <header>
    <button id="back" class="icon" aria-label="Back" hidden><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
    <h1 id="heading">Ttaku</h1>
    <div class="tools" id="tools">
      <button id="open-words" class="icon" aria-label="Word bank" title="Word bank"><svg viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></button>
      <button id="open-settings" class="icon" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>

  <section id="practice-view">
    <p id="error" role="alert" hidden></p>
    <div class="practice-row"><span>Practice</span><button id="start" class="powerswitch" role="switch" aria-checked="false" aria-label="Practice on or off" disabled><span></span></button></div>
    <div id="modes" class="modes" role="radiogroup" aria-label="Practice mode">
      <button class="mode" data-mode="rehearse" role="radio" aria-checked="true"><span class="radio"></span><span class="mode-text"><span class="mode-name">Rehearse</span><span class="mode-desc">Like practicing with a patient friend. The show pauses after every line, shows you the words in English letters, and waits until you say them before it plays again.</span></span></button>
      <button class="mode" data-mode="phrase" role="radio" aria-checked="false"><span class="radio"></span><span class="mode-text"><span class="mode-name">Phrase</span><span class="mode-desc">For that one line you almost caught. Press Caps Lock and the show jumps back 10 seconds, plays it again, then pauses so you can try saying it yourself.</span></span><kbd>Caps Lock</kbd></button>
      <button class="mode" data-mode="karaoke" role="radio" aria-checked="false"><span class="radio"></span><span class="mode-text"><span class="mode-name">Karaoke</span><span class="mode-desc">For talking along with the characters. The words appear at the top while the scene plays, and fill in as you say them — the show never stops.</span></span><kbd>Shift</kbd></button>
    </div>
  </section>

  <section id="words-view" hidden>
    <h3>Words you say a lot</h3>
    <div id="spoken"></div>
    <h3>Saved words</h3>
    <div id="words"></div>
    <button id="export" class="secondary" hidden>Export word bank</button>
  </section>

  <section id="settings-view" hidden>
    <h3>Meta Model API key</h3>
    <input id="meta-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key" aria-label="Meta Model API key">
    <div class="keyrow">
      <button id="key-save" class="secondary">Save</button>
      <button id="key-test" class="secondary">Test connection</button>
      <button id="key-clear" class="secondary">Clear</button>
    </div>
    <p id="key-status" class="hint" role="status"></p>
    <div class="row"><span>Microphone</span><button class="secondary" id="mic">Allow access</button></div>
    <div class="row"><span>Show Japanese text</span><button id="japanese-toggle" role="switch" aria-checked="false" aria-label="Show Japanese text" class="switch"><span></span></button></div>
    <div class="row"><span>Lines practiced</span><span id="progress" class="value"></span></div>
  </section>
</main>
<script type="module" src="setup.js"></script>
</body>
</html>
